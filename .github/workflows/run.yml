name: Run EvilGPT Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_evil_bot]

permissions:
  contents: write

concurrency:
  group: evilgpt-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          set -euo pipefail
          echo "Disk and memory before cleanup:"
          df -h /
          free -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/chromium
          echo "Disk and memory after cleanup:"
          df -h /
          free -h

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install llama.cpp Runtime
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v llama
          llama --help

      - name: Start Local OpenAI-Compatible Model Server
        env:
          HF_HOME: /tmp/huggingface
          LLAMA_ARG_CTX_SIZE: "4096"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # This downloads the open-weight GGUF model from Hugging Face.
          # No OpenAI API key or hosted inference service is used.
          nohup llama serve -hf ggml-org/gpt-oss-20b-GGUF --port 8080 --ctx-size 4096 > /tmp/llama-server.log 2>&1 &
          echo $! > /tmp/llama-server.pid

          ready=0
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              ready=1
              echo "llama.cpp server is ready."
              break
            fi
            if ! kill -0 "$(cat /tmp/llama-server.pid)" 2>/dev/null; then
              echo "ERROR: llama.cpp server exited during startup."
              tail -n 160 /tmp/llama-server.log || true
              exit 1
            fi
            sleep 10
          done
          if [[ "$ready" != "1" ]]; then
            echo "ERROR: model server did not become ready in 30 minutes."
            tail -n 160 /tmp/llama-server.log || true
            exit 1
          fi

      - name: Test Local Model Inference
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 300 \
            http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"gpt-oss-20b","messages":[{"role":"user","content":"Say hello in Hindi in one short sentence."}],"max_tokens":100,"stream":false}')"
          echo "$response"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("choices") and d["choices"][0].get("message",{}).get("content","").strip(), "Empty model response"' <<< "$response"

      - name: Validate Python Syntax
        run: python -m py_compile main.py

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LLM_API_URL: http://127.0.0.1:8080/v1/chat/completions
          LLM_MODEL: gpt-oss-20b
          LLM_TIMEOUT_SECONDS: "300"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: bash ./start.sh
