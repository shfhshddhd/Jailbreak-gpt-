name: Run EvilGPT Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_evil_bot]

permissions:
  contents: write

concurrency:
  group: evilgpt-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Install and Start Temporary Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl enable --now ollama
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Ollama did not start in time."
          sudo journalctl -u ollama --no-pager -n 80 || true
          exit 1

      - name: Download AI Model
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:1b' }}
        run: |
          set -euo pipefail
          echo "Using Ollama model: ${OLLAMA_MODEL}"
          ollama pull "${OLLAMA_MODEL}"
          curl -fsS http://127.0.0.1:11434/api/tags

      - name: Validate Python Syntax
        run: python -m py_compile main.py

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:1b' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: bash ./start.sh
