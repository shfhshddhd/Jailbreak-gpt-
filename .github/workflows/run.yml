name: Run EvilGPT Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_evil_bot]

permissions:
  contents: write

concurrency:
  group: evilgpt-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The gpt-oss:20b quantized model is large. Free preinstalled SDKs
      # that this Python bot does not need, then inspect available resources.
      - name: Free Runner Disk Space
        run: |
          set -euo pipefail
          echo "Resources before cleanup:"
          df -h /
          free -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/chromium
          echo "Resources after cleanup:"
          df -h /
          free -h

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Install and Start Temporary Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh

          # Keep Ollama's context and parallelism modest for a hosted runner.
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          sudo tee /etc/systemd/system/ollama.service.d/runner-memory.conf >/dev/null <<'EOF'
          [Service]
          Environment="OLLAMA_NUM_PARALLEL=1"
          Environment="OLLAMA_MAX_LOADED_MODELS=1"
          Environment="OLLAMA_CONTEXT_LENGTH=4096"
          Environment="OLLAMA_FLASH_ATTENTION=1"
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now ollama

          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Ollama did not start in time."
          sudo journalctl -u ollama --no-pager -n 80 || true
          exit 1

      - name: Download OpenAI Open-Weight Model
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gpt-oss:20b' }}
        run: |
          set -euo pipefail
          echo "Using Ollama model: ${OLLAMA_MODEL}"
          df -h /
          ollama pull "${OLLAMA_MODEL}"
          curl -fsS http://127.0.0.1:11434/api/tags
          df -h /

      - name: Test Local Model Inference
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gpt-oss:20b' }}
        run: |
          set -euo pipefail
          echo "Testing a short local response before starting Telegram polling..."
          MODEL_OUTPUT="$(timeout 300s ollama run "${OLLAMA_MODEL}" "Say hello in Hindi in one short sentence.")"
          printf '%s\n' "${MODEL_OUTPUT}"
          if [[ -z "${MODEL_OUTPUT//[[:space:]]/}" ]]; then
            echo "ERROR: The local model returned an empty response."
            exit 1
          fi

      - name: Validate Python Syntax
        run: python -m py_compile main.py

      - name: Run Unit Tests
        env:
          MEMORY_DB_PATH: /tmp/evilgpt-tests.sqlite3
        run: python -m unittest discover -s tests -v

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gpt-oss:20b' }}
          OLLAMA_TIMEOUT_SECONDS: "300"
          MEMORY_DB_PATH: data/conversations.sqlite3
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: bash ./start.sh
